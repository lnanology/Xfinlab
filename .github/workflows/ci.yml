name: CI

# Keeps "keep go build" (Railway deploy stability) honest: every push/PR to
# main gets a syntax + smoke-test check *before* it can silently break prod.
# This does NOT deploy anything -- Railway still auto-deploys off main on its
# own trigger, same as today. This just gives you (and Claude) a visible
# red/green signal before that happens.
#
# 2026-08-29: split into two named jobs (build-check + extended-checks) so
# there are two distinct GitHub status checks, matching the repo's branch
# ruleset ("2 of 2 required status checks") added around this date. Was
# previously a single `build-check` job -- a repo with a rule requiring 2
# checks but a workflow only producing 1 would permanently block every PR
# from merging, regardless of how green the actual run is. Splitting keeps
# the exact same hard-gate-vs-informational split as before; nothing that
# was blocking became non-blocking, and nothing that was non-blocking
# became blocking.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Hard gate: catches syntax errors / bad merges before they ever reach
      # Railway. Cheap, deterministic, cannot be flaky.
      - name: Syntax check (py_compile)
        run: |
          find . -name "*.py" -not -path "./.git/*" -print0 \
            | xargs -0 python -m py_compile

      # Hard gate: boots the real FastAPI app in-process (same backend.main
      # that Railway runs) and hits "/" + "/docs". If this fails, the app
      # would fail to start on Railway too.
      - name: App boot smoke test
        run: pytest tests/test_level1.py -v

  extended-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Informational only: engine unit tests (RuleEngine/ScoreEngine/
      # RiskEngine/DecisionEngine/EventEngine) are offline and safe, but
      # TestCryptoService in the same file calls a live external crypto price
      # API -- that can legitimately fail on rate limits/network hiccups
      # unrelated to any real bug, so this step is non-blocking by design.
      - name: Engine unit tests (non-blocking)
        run: pytest tests/test_suite.py -v
        continue-on-error: true

      # Informational only: requirements-dev.txt already lists ruff but
      # nothing has ever run it -- surfacing it now without blocking merges,
      # since the existing codebase hasn't been linted before and a hard
      # gate here would likely flag a lot of pre-existing, non-urgent style
      # issues rather than new bugs.
      - name: Lint (non-blocking)
        run: ruff check . || true
        continue-on-error: true

      # 2026-07-26: BDD scenarios (Given/When/Then, via pytest-bdd -- already
      # added to requirements-dev.txt above, no other change needed here).
      # Covers: i18n translation-table coverage (regression guard for the
      # "some languages missing a key" bug class fixed twice this session),
      # admin-endpoint auth rejection (read-only, confirms task #182's
      # verify_admin() gate is still in place -- never touches real
      # credentials or weakens the gate), and app health. Starts
      # non-blocking like the two steps above, since this is brand new and
      # still small -- can flip to a hard gate once it's grown real
      # coverage and proven itself flake-free.
      - name: BDD scenarios (non-blocking)
        run: pytest tests/step_defs/ -v
        continue-on-error: true


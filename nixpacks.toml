[phases.ffmpeg]
# Growth OS Phase 7 (2026-08-04): system-level ffmpeg/ffprobe binaries for
# services/video_engine_service.py's video rendering pipeline. FIX #1
# (2026-08-04): this was originally named [phases.setup], which broke
# production -- defining a phase named "setup" in nixpacks.toml REPLACES
# Nixpacks' auto-detected Python provider setup phase entirely rather
# than merging with it, which dropped python/pip from the build image
# ("python: command not found"). Using a distinct phase name + explicit
# dependsOn=["setup"] is purely additive instead: it runs after the
# real setup phase without touching it.
# FIX #2 (2026-08-04): using nixPkgs=["ffmpeg"] pulled ffmpeg's shared
# libraries (libstdc++ etc, via a newer gcc-lib) from a nix store path
# built against a newer glibc than the one actually present in the
# runtime image, causing "GLIBC_2.38 not found" at runtime even though
# the build itself succeeded. Switched to aptPkgs instead: apt packages
# link against the base image's own glibc (the same one Python/every
# other runtime library already uses), so there's no cross-toolchain
# version mismatch. services/video_engine_service.py's is_available()
# still checks shutil.which("ffmpeg") at runtime and degrades to
# {"available": False} if this package is ever missing for any reason,
# so a problem here can only disable the one optional video feature,
# never break the app.
# 2026-08-04 addition: fonts-noto-cjk, so services/video_engine_service.py
# can actually render Chinese/Japanese/Korean text (ticker labels,
# disclaimer footer, and the 5 of 7 narration languages that are CJK)
# instead of tofu boxes -- DejaVuSans (the only font previously on this
# image) has no CJK glyphs at all. Noto Sans CJK is one font file that
# covers Simplified/Traditional Chinese, Japanese, and Korean, so a
# single addition covers all 5 CJK narration languages at once.
dependsOn = ["setup"]
aptPkgs = ["ffmpeg", "fonts-noto-cjk"]

[phases.litestream]
dependsOn = ["setup"]
cmds = [
  "curl -L https://github.com/benbjohnson/litestream/releases/download/v0.3.13/litestream-v0.3.13-linux-amd64.tar.gz -o /tmp/litestream.tar.gz",
  "mkdir -p /app/bin",
  "tar -xzf /tmp/litestream.tar.gz -C /app/bin",
  "chmod +x /app/bin/litestream"
]

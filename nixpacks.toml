[phases.litestream]
dependsOn = ["setup"]
cmds = [
  "curl -L https://github.com/benbjohnson/litestream/releases/download/v0.3.13/litestream-v0.3.13-linux-amd64.tar.gz -o /tmp/litestream.tar.gz",
  "mkdir -p /app/bin",
  "tar -xzf /tmp/litestream.tar.gz -C /app/bin",
  "chmod +x /app/bin/litestream"
]

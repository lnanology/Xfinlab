.search-field:focus{border-color:var(--blue);}
.search-field::placeholder{color:var(--text3);}

.ai-summary-text{font-size:0.85rem;color:var(--text2);line-height:1.7;}

<div class="container">
  <div class="page-tag">即時資訊</div>
  <h1 class="page-title">市場新聞追蹤</h1>
  <p class="page-sub">輸入股票代號或關鍵詞，AI即時搜尋相關新聞並分析市場影響</p>
  <div class="category-row">
    <div class="cat-btn active" onclick="setActive(this);loadNews('全球金融市場最新重要新聞')">🌍 全部</div>
    <div class="cat-btn" onclick="setActive(this);loadNews('港股市場最新重要新聞及分析')">🇭🇰 港股</div>
    <div class="cat-btn" onclick="setActive(this);loadNews('美股市場最新重要新聞及分析')">🇺🇸 美股</div>
    <div class="cat-btn" onclick="setActive(this);loadNews('加密貨幣市場最新重要新聞')">🪙 加密</div>
    <div class="cat-btn" onclick="setActive(this);loadNews('全球宏觀經濟最新新聞及央行政策')">📊 宏觀</div>
    <div class="cat-btn" onclick="setActive(this);loadNews('地緣政治及戰爭對金融市場的最新影響')">⚠️ 地緣</div>
  </div>
  <div class="search-row">
    <input class="search-field" id="newsSearch" placeholder="搜尋股票代號或關鍵詞，例：騰訊、AAPL、加息…" onkeydown="if(event.key==='Enter')searchNews()">
    <button class="search-btn" onclick="searchNews()">🔍 AI 搜尋分析</button>
  </div>
  <div id="newsArea"><div class="loading"><div class="dot-ani">載入中<span>.</span><span>.</span><span>.</span></div></div></div>
</div>
<script>
function setActive(btn){document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
async function loadNews(topic){
  document.getElementById('newsArea').innerHTML='<div class="loading"><div class="dot-ani">AI 搜尋分析中<span>.</span><span>.</span><span>.</span></div></div>';
  const query=`請提供關於「${topic}」的最新市場資訊分析。

格式如下：
## 📰 市場摘要
（2-3句總結當前市況）

## 🔥 重點新聞（列出5條最重要新聞，每條包含：標題、簡述、市場影響）

## 📊 AI 市場影響分析
（分析對相關股票/市場的短期影響）

## ⚠️ 需要關注的風險
（列出2-3個主要風險點）`;
  try{
    const payload = { query, user: 'xfinlab-news' };
    const res = await postApi('/api/news-denoise', payload);
    const answer = (res && (res.data?.analysis || res.data?.conclusion || res.data?.answer || res.answer || res.data?.summary)) || '';
    if (answer) {
      document.getElementById('newsArea').innerHTML = `
        <div class="ai-summary"><div class="ai-summary-title">🤖 AI 市場分析報告 — ${new Date().toLocaleString('zh-HK')}</div><div class="ai-summary-text">${fmt(answer)}</div></div>
        <div style="font-size:0.72rem;color:var(--text3);margin-top:1rem;">⚠️ 以上分析由AI生成，僅供參考，不構成投資建議。</div>`;
    } else {
      document.getElementById('newsArea').innerHTML = '<div class="loading" style="color:var(--accent-red)">搜尋完成，但無結果可顯示。</div>';
    }
  } catch(e){ document.getElementById('newsArea').innerHTML = '<div class="loading" style="color:var(--accent-red)">搜尋出現問題，請稍後重試。</div>'; }
}
function searchNews(){
  const v=document.getElementById('newsSearch').value.trim();
  if(!v)return;
  loadNews(`${v}的最新市場新聞及影響分析`);
}
function fmt(t){return t.replace(/\*\*(.+?)\*\*/g,'<strong style="color:var(--gold)">$1</strong>').replace(/^## (.+)$/gm,'<h3 style="color:var(--blue);font-size:0.88rem;font-weight:500;margin:0.8rem 0 0.3rem">$1</h3>').replace(/\n/g,'<br>');}
loadNews('全球金融市場最新重要新聞');
</script>

<!-- Feedback Widget -->
<div id="fbWidget" style="position:fixed;bottom:24px;left:24px;z-index:999;display:flex;flex-direction:column;align-items:flex-start;gap:8px">
  <div id="fbPanel" style="display:none;background:#0d1525;border:1px solid #1e2d45;border-radius:12px;padding:20px;width:280px;box-shadow:0 8px 32px rgba(0,0,0,0.4)">
    <div style="font-weight:700;margin-bottom:4px;color:#e2e8f0">💬 Feedback</div>
    <div style="font-size:0.78rem;color:#64748b;margin-bottom:12px">Bug report, feature request or suggestions</div>
    <select id="fbType" style="width:100%;background:#080c14;border:1px solid #1e2d45;color:#e2e8f0;padding:8px;border-radius:6px;margin-bottom:8px;font-family:inherit;font-size:0.82rem">
      <option value="bug">🐛 Bug Report</option>
      <option value="feature">💡 Feature Request</option>
      <option value="general">💬 General Feedback</option>
    </select>
    <textarea id="fbMessage" placeholder="Tell us what you think..." style="width:100%;background:#080c14;border:1px solid #1e2d45;color:#e2e8f0;padding:8px;border-radius:6px;margin-bottom:8px;font-family:inherit;font-size:0.82rem;height:80px;resize:none"></textarea>
    <input id="fbEmail" type="email" placeholder="Email (optional)" style="width:100%;background:#080c14;border:1px solid #1e2d45;color:#e2e8f0;padding:8px;border-radius:6px;margin-bottom:10px;font-family:inherit;font-size:0.82rem">
    <button onclick="submitFeedback()" style="width:100%;background:#00d4ff;color:#000;border:none;padding:9px;border-radius:6px;font-weight:700;font-size:0.85rem;cursor:pointer">Send Feedback</button>
    <div id="fbStatus" style="font-size:0.78rem;margin-top:8px;text-align:center"></div>
  </div>
  <button onclick="document.getElementById('fbPanel').style.display=document.getElementById('fbPanel').style.display==='none'?'block':'none'" style="background:#7c3aed;color:#fff;border:none;border-radius:99px;padding:10px 18px;font-weight:700;font-size:0.82rem;cursor:pointer;box-shadow:0 4px 16px rgba(124,58,237,0.3)">
    💬 Feedback
  </button>
</div>
<script>
async function submitFeedback() {
  const type = document.getElementById('fbType').value;
  const message = document.getElementById('fbMessage').value.trim();
  const email = document.getElementById('fbEmail').value.trim();
  const status = document.getElementById('fbStatus');
  const token = localStorage.getItem('xfinlab_token');

  if (!message) { status.textContent = 'Please enter a message'; status.style.color = '#ef4444'; return; }

  try {
    const res = await fetch('https://api.xfinlab.com/api/feedback', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ type, message, email: email || null, token })
    });
    const data = await res.json();
    status.textContent = '✅ ' + data.message;
    status.style.color = '#10b981';
    document.getElementById('fbMessage').value = '';
    document.getElementById('fbEmail').value = '';
    setTimeout(() => { document.getElementById('fbPanel').style.display = 'none'; }, 2000);
  } catch(e) {
    status.textContent = '❌ Error sending feedback';
    status.style.color = '#ef4444';
  }
}
</script>

<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XFINLAB — Decision Engine™ 機率掃描</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/nav.js"></script>
<script src="js/i18n.js"></script>
<script src="js/share-widget.js"></script>
<script src="js/ai-loading.js"></script>
<script src="js/prob-display.js"></script>
<script src="js/share-tools.js"></script>
<script src="js/mvp-api.js"></script>
<style>
nav{padding:0.7rem 1.5rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:var(--navy2);position:sticky;top:0;z-index:10;}
.scan-bar{display:flex;gap:0.8rem;margin-bottom:1.5rem;flex-wrap:wrap;}
.scan-input{flex:1;min-width:200px;background:var(--navy3);border:1px solid var(--border2);border-radius:6px;padding:0.7rem 0.9rem;color:var(--text);font-family:'Inter',sans-serif;font-size:0.92rem;outline:none;}
.scan-input:focus{border-color:var(--blue);}
.scan-btn{background:var(--blue2);color:#fff;border:none;border-radius:6px;padding:0.7rem 1.6rem;font-size:0.88rem;font-weight:500;cursor:pointer;transition:background 0.2s;}
.scan-btn:hover{background:var(--blue);}
.scan-btn:disabled{background:var(--navy4);color:var(--text3);cursor:not-allowed;}
.disclaimer-box{background:rgba(201,168,76,0.08);border:1px solid rgba(201,168,76,0.3);border-radius:6px;padding:0.9rem 1.1rem;margin-bottom:1.5rem;font-size:0.8rem;color:var(--text2);line-height:1.6;}
.prob-panel{background:var(--navy2);border:1px solid var(--border);border-radius:8px;padding:1.4rem;margin-bottom:1rem;display:none;}
.prob-panel.show{display:block;}
.prob-bar-row{display:flex;align-items:center;gap:1rem;margin-bottom:0.6rem;}
.prob-bar-label{width:110px;font-size:0.82rem;color:var(--text2);flex-shrink:0;}
.prob-bar-track{flex:1;height:22px;background:var(--navy3);border-radius:11px;overflow:hidden;position:relative;}
.prob-bar-fill{height:100%;border-radius:11px;transition:width 0.4s ease;}
.prob-bar-fill.bull{background:linear-gradient(90deg,#1a9c6a,#2ecc8f);}
.prob-bar-fill.bear{background:linear-gradient(90deg,#c94c4c,#e06868);}
.prob-bar-pct{width:60px;text-align:right;font-family:'DM Serif Display',serif;font-size:1rem;color:var(--text);}
.sub-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-top:1.2rem;}
.sub-card{background:var(--navy3);border:1px solid var(--border2);border-radius:6px;padding:0.9rem;}
.sub-card-label{font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);margin-bottom:0.4rem;}
.sub-card-value{font-family:'DM Serif Display',serif;font-size:1.15rem;color:var(--blue);}
.data-quality-tag{font-size:0.72rem;color:var(--text3);margin-top:1rem;}
.loading-text{text-align:center;padding:2rem;color:var(--text2);}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">X<em>FIN</em>LAB</a>
  <div class="nav-links">
    <a href="chart-analysis.html" class="nav-link" data-i18n="nav_chart">K線分析</a>
    <a href="screener.html" class="nav-link" data-i18n="nav_screener">篩選器</a>
    <a href="dashboard.html" class="nav-link" data-i18n="nav_dashboard">儀表板</a>
    <a href="anomaly.html" class="nav-link" data-i18n="nav_anomaly">異常偵測</a>
    <a href="portfolio.html" class="nav-link" data-i18n="nav_portfolio">組合配置</a>
    <a href="chat.html" class="nav-cta" data-i18n="ps_nav_ai">AI 分析</a>
  </div>
</nav>

<div class="container">
  <div class="page-tag">Decision Engine™</div>
  <h1 class="page-title" data-i18n="ps_title">機率掃描</h1>
  <p class="page-sub" data-i18n="ps_subtitle">綜合真實市場數據、技術指標同新聞情緒，計算睇多/睇淡機率——唔係買賣建議。</p>

  <div class="disclaimer-box">
    <span data-i18n="ps_disclaimer_1">⚠️ 呢個功能用緊嘅內部評分公式（風險/因子/新聞情緒）暫時未經歷史回測校準，
    純粹將真實數據代入公式計算出嚟嘅參考機率，</span><strong data-i18n="ps_disclaimer_strong">唔構成任何投資建議</strong><span data-i18n="ps_disclaimer_2">，
    請自行判斷同承擔風險。</span>
  </div>

  <div class="scan-bar">
    <input id="tickerInput" class="scan-input" type="text" placeholder="輸入股票代號，例如 AAPL、TSLA、0700.HK" data-i18n-placeholder="ps_input_placeholder">
    <button id="scanBtn" class="scan-btn" onclick="runScan()" data-i18n="ps_scan_btn">🔍 掃描</button>
  </div>

  <div id="resultPanel" class="prob-panel">
    <div style="font-size:0.72rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--blue);margin-bottom:1.2rem;" id="resultTicker">-</div>

    <div class="prob-bar-row">
      <div class="prob-bar-label" data-i18n="ps_bull_label">睇多機率</div>
      <div class="prob-bar-track"><div class="prob-bar-fill bull" id="bullBar" style="width:0%"></div></div>
      <div class="prob-bar-pct" id="bullPct">-</div>
    </div>
    <div class="prob-bar-row">
      <div class="prob-bar-label" data-i18n="ps_bear_label">睇淡機率</div>
      <div class="prob-bar-track"><div class="prob-bar-fill bear" id="bearBar" style="width:0%"></div></div>
      <div class="prob-bar-pct" id="bearPct">-</div>
    </div>

    <div class="sub-grid">
      <div class="sub-card">
        <div class="sub-card-label" data-i18n="ps_regime_label">市況</div>
        <div class="sub-card-value" id="regimeValue">-</div>
      </div>
      <div class="sub-card">
        <div class="sub-card-label" data-i18n="ps_risk_label">風險分數</div>
        <div class="sub-card-value" id="riskValue">-</div>
      </div>
      <div class="sub-card">
        <div class="sub-card-label" data-i18n="ps_factor_label">因子分數</div>
        <div class="sub-card-value" id="factorValue">-</div>
      </div>
      <div class="sub-card">
        <div class="sub-card-label" data-i18n="ps_news_label">新聞情緒</div>
        <div class="sub-card-value" id="newsValue">-</div>
      </div>
      <div class="sub-card">
        <div class="sub-card-label" data-i18n="ps_corr_label">大盤相關性</div>
        <div class="sub-card-value" id="corrValue">-</div>
      </div>
    </div>

    <div class="data-quality-tag" id="dataQualityTag"></div>
  </div>

  <div id="shareBar"></div>

  <div id="loadingBox" class="loading-text" style="display:none" data-i18n="ps_loading">計算緊…</div>
  <div id="errorBox" style="display:none;color:#e06868;font-size:0.85rem;padding:1rem 0;"></div>
</div>

<footer>
  <div class="footer-note"><span data-i18n="ps_footer_note">XFINLAB © 2026 · 機率掃描（實驗性）· </span><a href="privacy.html" style="color:var(--blue);text-decoration:none" data-i18n="nav_privacy">私隱政策</a></div>
</footer>

<script>
function t(key, fallback){ return (typeof I18N!=='undefined' && I18N.translations && I18N.translations[key]) || fallback; }

async function runScan(){
  const ticker = (document.getElementById('tickerInput').value || '').trim().toUpperCase();
  if(!ticker){ alert(t('ps_alert_no_ticker','請輸入股票代號')); return; }

  const btn = document.getElementById('scanBtn');
  const panel = document.getElementById('resultPanel');
  const loading = document.getElementById('loadingBox');
  const errorBox = document.getElementById('errorBox');

  btn.disabled = true; btn.textContent = t('ps_scanning_btn','掃描中...');
  panel.classList.remove('show');
  errorBox.style.display = 'none';
  loading.style.display = 'block';

  try {
    const res = await getApi(`/api/pipeline/${encodeURIComponent(ticker)}`);
    const d = res.data;

    document.getElementById('resultTicker').textContent = d.ticker || ticker;

    const bullPctRaw = Math.round((d.bullish_probability || 0) * 100);
    const bearPctRaw = Math.round((d.bearish_probability || 0) * 100);
    // Cosmetic display-only transform (js/prob-display.js) -- never
    // shows 100%, and differentiates identical raw scores across
    // tickers. Underlying bullish_probability/bearish_probability are
    // unchanged.
    const bullPct = (typeof window.xflDisplayProb === 'function') ? window.xflDisplayProb(bullPctRaw, ticker + 'bull') : bullPctRaw;
    const bearPct = (typeof window.xflDisplayProb === 'function') ? window.xflDisplayProb(bearPctRaw, ticker + 'bear') : bearPctRaw;
    document.getElementById('bullBar').style.width = bullPct + '%';
    document.getElementById('bearBar').style.width = bearPct + '%';
    document.getElementById('bullPct').textContent = bullPct + '%';
    document.getElementById('bearPct').textContent = bearPct + '%';

    document.getElementById('regimeValue').textContent = d.market_regime || t('ps_regime_unknown','未知');
    document.getElementById('riskValue').textContent = (d.risk_score != null ? d.risk_score : '-') + (d.risk_level ? ` (${d.risk_level})` : '');
    document.getElementById('factorValue').textContent = d.factor_score != null ? d.factor_score : '-';
    document.getElementById('newsValue').textContent = d.news_sentiment_score != null ? d.news_sentiment_score : '-';
    document.getElementById('corrValue').textContent = d.market_correlation != null ? d.market_correlation : '-';

    const dq = d.data_quality || {};
    const dqFallback = t('ps_dq_fallback','⚠️退回預設值');
    document.getElementById('dataQualityTag').textContent =
      `${t('ps_dq_tech','數據來源：技術分析')}${dq.tech_ok ? '✅' : dqFallback} · ${t('ps_dq_snapshot','即時報價')}${dq.snapshot_ok ? '✅' : dqFallback}`;

    panel.classList.add('show');

    // Share System -- Link re-runs this SAME real scan for the same
    // ticker. No "Suggested Action" text is ever attached on this page
    // (see api/pipeline_api.py's docstring: these internal formulas
    // aren't backtested/calibrated, so this page deliberately avoids
    // anything recommendation-shaped) -- Image/PDF/Link here just export
    // the same disclosed probability view, nothing more.
    if (typeof window.renderShareBar === 'function') {
      const shareUrl = `${location.origin}${location.pathname}?ticker=${encodeURIComponent(ticker)}`;
      window.renderShareBar('shareBar', 'resultPanel', {
        filename: `xfinlab-probability-scan-${ticker}`,
        shareUrl: shareUrl
      });
    }
  } catch(err) {
    errorBox.textContent = t('ps_error_prefix','掃描失敗：') + err.message;
    errorBox.style.display = 'block';
  } finally {
    loading.style.display = 'none';
    btn.disabled = false; btn.textContent = t('ps_scan_btn','🔍 掃描');
  }
}

// Share System: a link like probability-scan.html?ticker=TSLA prefills
// the input and re-runs the same real scan.
window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(location.search);
  const tickerParam = params.get('ticker');
  if (tickerParam) {
    document.getElementById('tickerInput').value = tickerParam;
    runScan();
  }
});

document.getElementById('tickerInput').addEventListener('keydown', function(e){
  if(e.key === 'Enter') runScan();
});
</script>
</body>
</html>

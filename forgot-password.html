<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>忘記密碼 — XFINLAB</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  /* Light default (2026-07-18): white bg, black text, black border. */
  :root {
    --bg: #FFFFFF; --surface: #FFFFFF; --border: #000000;
    --accent: #2563EB; --green: #16A34A; --red: #DC2626;
    --text: #000000; --muted: #666666; --label: #333333;
  }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
  nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 32px; border-bottom: 1px solid var(--border); }
  .nav-brand { font-size: 1.1rem; font-weight: 700; color: var(--accent); text-decoration: none; }
  .nav-brand span { color: var(--text); }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
  .auth-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 40px; width: 100%; max-width: 420px; }
  .auth-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; }
  .auth-sub { color: var(--muted); font-size: 0.875rem; margin-bottom: 28px; line-height: 1.6; }
  .form-group { margin-bottom: 18px; }
  label { display: block; font-size: 0.75rem; font-weight: 500; color: var(--label); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.08em; }
  input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 11px 14px; border-radius: 8px; font-size: 0.9rem; font-family: inherit; }
  input:focus { outline: none; border-color: var(--accent); }
  .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; margin-top: 8px; }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-primary:hover { opacity: 0.85; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .success { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); color: var(--green); padding: 16px; border-radius: 8px; font-size: 0.85rem; line-height: 1.6; display: none; }
  .error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: var(--red); padding: 10px 14px; border-radius: 8px; font-size: 0.82rem; margin-bottom: 16px; display: none; }
  .switch-text { text-align: center; font-size: 0.82rem; color: var(--muted); margin-top: 20px; }
  .switch-text a { color: var(--accent); text-decoration: none; font-weight: 500; }
  footer { text-align: center; padding: 20px; color: var(--muted); font-size: 0.75rem; border-top: 1px solid var(--border); }
</style>
</head>
<body>
<nav><a href="index.html" class="nav-brand">X<span>FIN</span>LAB</a></nav>
<main>
  <div class="auth-box">
    <div class="auth-title">忘記密碼</div>
    <div class="auth-sub">輸入你的註冊電郵，我們會發送重設密碼連結給你。</div>

    <div id="errorMsg" class="error"></div>
    <div id="successMsg" class="success"></div>

    <div id="formArea">
      <div class="form-group">
        <label>電郵地址</label>
        <input type="email" id="email" placeholder="you@example.com">
      </div>
      <button class="btn btn-primary" id="submitBtn" onclick="handleSubmit()">發送重設連結</button>
    </div>

    <div class="switch-text">想起密碼了？<a href="login.html">返回登入</a></div>
  </div>
</main>
<footer>© 2026 XFINLAB</footer>

<script>
const API = "https://api.xfinlab.com/api";

async function handleSubmit() {
  const email = document.getElementById('email').value.trim();
  if (!email) {
    document.getElementById('errorMsg').textContent = '請輸入電郵地址';
    document.getElementById('errorMsg').style.display = 'block';
    return;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '發送中...';

  try {
    const res = await fetch(`${API}/auth/forgot-password`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ email })
    });
    const data = await res.json();

    document.getElementById('errorMsg').style.display = 'none';
    document.getElementById('formArea').style.display = 'none';
    document.getElementById('successMsg').textContent = data.message || '重設連結已發送，請查收電郵。';
    document.getElementById('successMsg').style.display = 'block';
  } catch(e) {
    document.getElementById('errorMsg').textContent = '連接錯誤，請確保 API 正在運行';
    document.getElementById('errorMsg').style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = '發送重設連結';
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') handleSubmit(); });
</script>
</body>
</html>

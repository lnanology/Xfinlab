<style>
body{font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column;color:var(--text-primary);background:var(--bg-primary)}
nav{position:sticky;top:0;z-index:100;padding:10px 18px;border-bottom:1px solid var(--border-color);background:var(--bg-primary)}
.container{max-width:1000px;margin:0 auto;padding:28px 18px;flex:1}

.input-section{background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;padding:16px;margin-bottom:16px}
.input-label{font-size:0.75rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-secondary);display:block;margin-top:0.5rem;font-weight:600}
.analyze-btn{background:var(--accent-blue);color:#fff;border:none;border-radius:8px;padding:0 16px;font-size:0.95rem;font-weight:600;cursor:pointer;height:44px}
.analyze-btn:hover{background:#1D4ED8}
.analyze-btn:disabled{background:#F3F4F6;color:var(--text-muted);cursor:not-allowed}
.api-hint{font-size:0.88rem;color:var(--text-muted);margin-top:0.6rem}
.api-response-section{background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;padding:16px;margin-bottom:16px}
.api-response-title{font-size:0.92rem;color:var(--accent-blue);font-weight:600}
.api-response{background:var(--bg-card);border:1px solid var(--border-color);border-radius:8px;padding:12px;margin-top:8px}
.api-response-json{white-space:pre-wrap;font-family:'Inter',sans-serif;font-size:0.88rem;color:var(--text-secondary);line-height:1.6;word-break:break-word}

.loading-state{text-align:center;padding:1.75rem 1.5rem;color:var(--text-secondary)}

.result-title{font-size:0.75rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--accent-blue);margin-bottom:0.8rem;font-weight:600}

.sentiment-section{background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;padding:16px;margin-bottom:16px;display:none}
.sentiment-section.show{display:block}
.sentiment-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:12px}
.sentiment-card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:10px;padding:12px;text-align:center}
.sentiment-label{font-size:0.75rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:0.6rem}
.sentiment-gauge{width:100%;height:44px;border-radius:22px;background:var(--bg-secondary);overflow:hidden;margin-bottom:12px;position:relative}
.sentiment-fill{height:100%;transition:width 0.6s ease;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:0.9rem}
.sentiment-bullish{background:linear-gradient(90deg,var(--accent-green),var(--accent-blue))}
.sentiment-neutral{background:linear-gradient(90deg,var(--text-muted),var(--accent-orange))}
.sentiment-bearish{background:linear-gradient(90deg,var(--accent-red),var(--accent-orange))}
.sentiment-score{font-family:'DM Serif Display',serif;font-size:1.6rem;color:var(--text-primary);margin-bottom:0.3rem}
.sentiment-label-small{font-size:0.72rem;color:var(--text-muted)}

.news-section{background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;padding:12px;margin-bottom:16px;display:none}
.news-section.show{display:block}
.news-list{display:flex;flex-direction:column;gap:12px;max-height:400px;overflow-y:auto}
.news-item{background:var(--bg-card);border:1px solid var(--border-color);border-radius:8px;padding:12px}
.news-source{font-size:0.75rem;color:var(--text-muted);margin-bottom:6px}
.news-headline{font-size:0.96rem;color:var(--text-primary);font-weight:600;margin-bottom:6px;line-height:1.4}
.news-snippet{font-size:0.88rem;color:var(--text-secondary);line-height:1.6}
.news-sentiment-badge{display:inline-block;font-size:0.75rem;padding:0.2rem 0.6rem;border-radius:12px;margin-top:0.6rem;font-weight:600}
.sentiment-pos{background:rgba(22,163,74,0.12);color:var(--accent-green)}
.sentiment-neg{background:rgba(220,38,38,0.12);color:var(--accent-red)}
.sentiment-neu{background:rgba(107,114,128,0.08);color:var(--text-secondary)}

.denoised-section{background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;padding:12px;margin-bottom:16px;display:none}
.denoised-section.show{display:block}
.denoised-content{background:var(--bg-card);border:1px solid var(--border-color);border-radius:8px;padding:12px;margin-top:8px}
.fact-item{border-left:3px solid var(--accent-blue);padding-left:1rem;margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid var(--border-color)}
.fact-item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.fact-title{font-size:0.88rem;font-weight:600;color:var(--accent-blue);margin-bottom:0.3rem}
.fact-description{font-size:0.88rem;color:var(--text-secondary);line-height:1.6}
.fact-impact{display:inline-block;font-size:0.78rem;color:var(--text-muted);margin-top:0.4rem;padding:0.2rem 0.5rem;background:var(--bg-secondary);border-radius:3px}

.blindspot-section{background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;padding:12px;margin-bottom:16px;display:none}
.blindspot-section.show{display:block}
.blindspot-content{background:var(--bg-card);border:1px solid var(--border-color);border-radius:8px;padding:12px;margin-top:8px}
.blindspot-item{border-left:3px solid var(--accent-orange);padding-left:1rem;margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid var(--border-color)}

.blindspot-title{font-size:0.88rem;font-weight:600;color:var(--accent-orange);margin-bottom:0.3rem}

.education-section{background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;padding:12px;margin-bottom:16px;display:none}
.education-section.show{display:block}
.education-content{background:var(--bg-card);border:1px solid var(--border-color);border-radius:8px;padding:12px;margin-top:8px;line-height:1.6}
.education-content h3{color:var(--accent-blue);font-size:0.92rem;font-weight:600;margin:1rem 0 0.4rem}
.education-content strong{color:var(--accent-orange)}
.education-content p{font-size:0.9rem;color:var(--text-secondary);margin-bottom:0.8rem}
.education-content ul{padding-left:1.5rem;font-size:0.9rem;color:var(--text-secondary)}
.education-content li{margin-bottom:0.4rem}

.disclaimer{font-size:0.85rem;color:var(--text-muted);border-top:1px solid var(--border-color);padding-top:1rem;margin-top:1rem;line-height:1.6}

.footer{padding:16px;border-top:1px solid var(--border-color);background:var(--bg-card);text-align:center}

<script>
async function simulateDifyApi() {
  const symbol = document.getElementById('difySymbolInput').value.trim().toUpperCase();
  const responseJson = document.getElementById('apiResponseJson');
  const button = document.getElementById('difyAnalyzeBtn');

  if (!symbol) {
    responseJson.textContent = '請先輸入股票代號，例如 AAPL 或 700.HK。';
    return;
  }

  button.disabled = true;
  responseJson.textContent = '正在呼叫 /api/news-denoise，請稍候…';

  try {
    const result = await postApi('/api/news-denoise', { symbol });
    const data = result.data;
    responseJson.textContent = JSON.stringify(result, null, 2);

    document.getElementById('sentimentSection').classList.add('show');
    document.getElementById('newsSection').classList.add('show');
    document.getElementById('denoisedSection').classList.add('show');
    document.getElementById('blindspotSection').classList.add('show');
    document.getElementById('educationSection').classList.add('show');

    document.getElementById('totalSentiment').style.width = data.sentimentIndex + '%';
    document.getElementById('totalScore').textContent = data.sentimentIndex + '/100';
    document.getElementById('totalLabel').textContent = data.sentimentIndex >= 60 ? '情緒較正面' : '情緒偏保守';
    document.getElementById('bullishGauge').style.width = data.sentiment.bullish + '%';
    document.getElementById('neutralGauge').style.width = data.sentiment.neutral + '%';
    document.getElementById('bearishGauge').style.width = data.sentiment.bearish + '%';
    document.getElementById('bullishPercent').textContent = data.sentiment.bullish + '%';
    document.getElementById('neutralPercent').textContent = data.sentiment.neutral + '%';
    document.getElementById('bearishPercent').textContent = data.sentiment.bearish + '%';

    const newsList = document.getElementById('newsList');
    newsList.innerHTML = data.facts.map(item => `
      <div class="news-item">
        <div class="news-source">${item.title}</div>
        <div class="news-headline">${item.text}</div>
      </div>
    `).join('');

    const denoisedContent = document.getElementById('denoisedContent');
    denoisedContent.innerHTML = data.facts.map(item => `
      <div class="fact-item">
        <div class="fact-title">${item.title}</div>
        <div class="fact-description">${item.text}</div>
      </div>
    `).join('');

    const blindspotContent = document.getElementById('blindspotContent');
    blindspotContent.innerHTML = data.blindspots.map(item => `
      <div class="blindspot-item">
        <div class="blindspot-title">${item.title}</div>
        <div class="blindspot-description">${item.text}</div>
      </div>
    `).join('');

    const educationContent = document.getElementById('educationContent');
    educationContent.innerHTML = `<p>${data.explanation}</p>`;
  } catch (error) {
    console.error(error);
    responseJson.textContent = '模擬 API 呼叫失敗，請稍後重試。';
  } finally {
    button.disabled = false;
  }
}
</script>

<script>
function toggleNav(){
  const navLinks = document.getElementById('navLinks');
  if(navLinks) navLinks.classList.toggle('open');
}
window.addEventListener('DOMContentLoaded', ()=> {
  const currentFile = location.pathname.split('/').pop() || 'index.html';
  document.querySelectorAll('.nav-link').forEach(link => {
    const href = link.getAttribute('href');
    if(href === currentFile || (href === 'index.html' && currentFile === '')) {
      link.classList.add('current');
    }
  });
  document.addEventListener('click', e => {
    const navLinks = document.getElementById('navLinks');
    const toggle = document.querySelector('.nav-toggle');
    if(navLinks && navLinks.classList.contains('open') && !navLinks.contains(e.target) && e.target !== toggle){
      navLinks.classList.remove('open');
    }
  });
});
</script>

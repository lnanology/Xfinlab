<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XFINLAB — 新聞去噪分析</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/nav.js"></script>
<script src="js/mvp-api.js"></script>

<style>
body{font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column;color:var(--text-primary);background:var(--bg-primary)}
nav{position:sticky;top:0;z-index:100;padding:10px 18px;border-bottom:1px solid var(--border-color);background:var(--bg-primary)}
.container{max-width:1000px;margin:0 auto;padding:28px 18px;flex:1}

.input-section{background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;padding:16px;margin-bottom:16px}
.input-label{font-size:0.75rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-secondary);display:block;margin-top:0.5rem;font-weight:600}
.input-row{display:flex;gap:0.8rem;align-items:center;flex-wrap:wrap;margin-top:0.5rem}
.input{flex:1;min-width:200px;background:var(--bg-secondary);border:1px solid var(--border-color);color:var(--text-primary);padding:0.6rem 0.8rem;border-radius:8px;outline:none;font-family:'Inter',sans-serif;font-size:0.95rem}
.analyze-btn{background:var(--accent-blue);color:#fff;border:none;border-radius:8px;padding:0 16px;font-size:0.95rem;font-weight:600;cursor:pointer;height:44px}
.analyze-btn:hover{background:#1D4ED8}
.analyze-btn:disabled{background:#F3F4F6;color:var(--text-muted);cursor:not-allowed}
.api-hint{font-size:0.88rem;color:var(--text-muted);margin-top:0.6rem}

.api-response-section{background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;padding:16px;margin-bottom:16px}
.api-response-title{font-size:0.92rem;color:var(--accent-blue);font-weight:600;cursor:pointer}
.api-response{background:var(--bg-card);border:1px solid var(--border-color);border-radius:8px;padding:12px;margin-top:8px;display:none}
.api-response.show{display:block}
.api-response-json{white-space:pre-wrap;font-family:'Inter',sans-serif;font-size:0.82rem;color:var(--text-secondary);line-height:1.6;word-break:break-word}

.loading-state{text-align:center;padding:1.75rem 1.5rem;color:var(--text-secondary)}
.dot-ani span{animation:blink 1.4s infinite;display:inline-block}
.dot-ani span:nth-child(2){animation-delay:0.2s}
.dot-ani span:nth-child(3){animation-delay:0.4s}
@keyframes blink{0%,80%,100%{opacity:0;}40%{opacity:1}}

.result-title{font-size:0.75rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--accent-blue);margin-bottom:0.8rem;font-weight:600}

.result-section{background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;padding:16px;margin-bottom:16px;display:none}
.result-section.show{display:block}
.result-content{background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:8px;padding:14px;margin-top:8px;line-height:1.75;font-size:0.92rem;color:var(--text-secondary)}
.result-content h3{color:var(--accent-blue);font-size:0.95rem;font-weight:600;margin:1rem 0 0.4rem}
.result-content h3:first-child{margin-top:0}
.result-content strong{color:var(--accent-orange)}

.disclaimer{font-size:0.85rem;color:var(--text-muted);border-top:1px solid var(--border-color);padding-top:1rem;margin-top:1rem;line-height:1.6}

.footer{padding:16px;border-top:1px solid var(--border-color);background:var(--bg-card);text-align:center}

@media(max-width:768px){
  nav{padding:0.7rem 1rem}
  .container{padding:18px 12px}
  .input-section{padding:12px}
  .input-row{flex-direction:column;align-items:stretch}
  .analyze-btn{width:100%}
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-brand">X<em>FIN</em>LAB</a>
  <button class="nav-toggle" aria-label="開啟選單" onclick="toggleNav()">☰</button>
  <div class="nav-links" id="navLinks">
    <a href="index.html" class="nav-link">首頁</a>
    <a href="ai-analysis.html" class="nav-link">AI市場分析</a>
    <a href="company-compare.html" class="nav-link">AB公司比較</a>
    <a href="news-denoise.html" class="nav-link">新聞降噪</a>
    <a href="stress-lab.html" class="nav-link">壓力測試室</a>
    <a href="chart-analysis.html" class="nav-link">K線分析</a>
    <a href="probability-scan.html" class="nav-link">機率掃描</a>
  </div>
</nav>

<div class="container">
  <div class="page-tag">AI 分析工具</div>
  <h1 class="page-title">新聞去噪分析</h1>
  <p class="page-sub">輸入股票代號或市場主題，AI 會整理最新新聞重點並過濾情感化炒作字眼，給你一份簡潔摘要。</p>

  <div class="input-section">
    <label class="input-label">股票代號或主題</label>
    <div class="input-row">
      <input type="text" id="difySymbolInput" class="input" placeholder="例如：AAPL、0700.HK、Fed 議息、大盤走勢">
      <button class="analyze-btn" id="difyAnalyzeBtn" onclick="simulateDifyApi()">開始分析</button>
    </div>
    <div class="api-hint">💡 由 AI 即時生成，非結構化新聞資料庫統計。</div>
  </div>

  <div class="api-response-section">
    <div class="api-response-title" onclick="document.getElementById('apiResponseBox').classList.toggle('show')">🔍 查看原始 API 回應（除錯用）</div>
    <div class="api-response" id="apiResponseBox">
      <div class="api-response-json" id="apiResponseJson">尚未查詢。</div>
    </div>
  </div>

  <div class="result-section" id="denoisedSection">
    <div class="result-title">📰 新聞分析報告</div>
    <div class="result-content" id="denoisedContent"></div>
    <div class="disclaimer">💡 以上內容由 AI 模型根據你提供的主題即時生成，屬於摘要與觀點整理，並非結構化新聞資料庫的統計結果，僅供參考，不構成投資建議。</div>
  </div>
</div>

<script>
async function simulateDifyApi() {
  const symbol = document.getElementById('difySymbolInput').value.trim();
  const responseJson = document.getElementById('apiResponseJson');
  const button = document.getElementById('difyAnalyzeBtn');
  const denoisedSection = document.getElementById('denoisedSection');
  const denoisedContent = document.getElementById('denoisedContent');

  if (!symbol) {
    responseJson.textContent = '請先輸入股票代號或主題，例如 AAPL 或 700.HK。';
    return;
  }

  button.disabled = true;
  denoisedSection.classList.remove('show');
  denoisedContent.innerHTML = '<div class="loading-state"><div class="dot-ani">AI 分析中<span>.</span><span>.</span><span>.</span></div></div>';
  denoisedSection.classList.add('show');
  responseJson.textContent = '正在呼叫 /api/news-denoise，請稍候…';

  try {
    const result = await postApi('/api/news-denoise', { query: symbol });
    const data = result.data || {};
    responseJson.textContent = JSON.stringify(result, null, 2);

    const text = data.analysis || data.conclusion || '';
    denoisedContent.innerHTML = text ? formatAnalysisText(text) : '<p>暫時未能取得分析內容，請稍後重試。</p>';
  } catch (error) {
    console.error(error);
    responseJson.textContent = 'API 呼叫失敗，請稍後重試。';
    denoisedContent.innerHTML = '<p>⚠️ 分析時出現問題，請稍後重試。</p>';
  } finally {
    button.disabled = false;
  }
}

function formatAnalysisText(text) {
  return text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h3>$1</h3>')
    .replace(/^# (.+)$/gm, '<h3>$1</h3>')
    .replace(/\n/g, '<br>');
}
</script>

<footer>
  <div class="footer-note">XFINLAB © 2026 · 智能金融分析平台 · <a href="privacy.html" style="color:var(--blue);text-decoration:none;">私隱政策</a></div>
</footer>

<script>
function toggleNav(){
  const navLinks = document.getElementById('navLinks');
  if(navLinks) navLinks.classList.toggle('open');
}
window.addEventListener('DOMContentLoaded', ()=> {
  const currentFile = location.pathname.split('/').pop() || 'index.html';
  document.querySelectorAll('.nav-link').forEach(link => {
    const href = link.getAttribute('href');
    if(href === currentFile || (href === 'index.html' && currentFile === '')) {
      link.classList.add('current');
    }
  });
  document.addEventListener('click', e => {
    const navLinks = document.getElementById('navLinks');
    const toggle = document.querySelector('.nav-toggle');
    if(navLinks && navLinks.classList.contains('open') && !navLinks.contains(e.target) && e.target !== toggle){
      navLinks.classList.remove('open');
    }
  });
});
</script>
</body>
</html>
